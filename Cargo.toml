[package]
name = "asciidoc2rs"
version = "0.1.0"
authors = ["kPherox <kphrx@kpherox.dev>"]
license = "MIT"
description = "A parser for AsciiDoc"
repository = "https://github.com/kphrx/asciidoc2rs"
keywords = ["asciidoc"]
categories = ["text-processing"]
edition = "2021"

readme = true


[dependencies]
nanoserde = { version = "0.2.1", default-features = false, features = ["std", "json"] }
