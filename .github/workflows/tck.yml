name: Check TCK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  tck:

    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tck.outputs.tests }}
      passed: ${{ steps.tck.outputs.pass }}
      failed: ${{ steps.tck.outputs.fail }}
      results: ${{ steps.summary.outputs.result }}

    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --verbose

      - name: Checkout https://gitlab.eclipse.org/eclipse/asciidoc-lang/asciidoc-tck
        run: git clone --depth=1 https://gitlab.eclipse.org/eclipse/asciidoc-lang/asciidoc-tck.git asciidoc-tck
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: asciidoc-tck/package-lock.json
      - name: Install dependencies
        working-directory: asciidoc-tck
        run: |
          npm ci
          npm run dist
          {
            echo 'import {inspect} from "node:util";'
            echo 'inspect.defaultOptions.depth = null;'
            echo 'Error.stackTraceLimit = 0;'
          } >> depth.js
      - name: Run AsciiDoc TCK
        continue-on-error: true
        id: tck
        working-directory: asciidoc-tck
        env:
          NODE_OPTIONS: --import ./depth.js
        run: |
          node harness/bin/asciidoc-tck.js cli --adapter-command ${{ github.workspace }}/target/debug/asciidoc2rs | tee output.txt
          grep 'ℹ' output.txt | awk '{print $2"="$3}' >> "$GITHUB_OUTPUT"
          sed -i'' '/^ℹ/d' output.txt

      - name: Summary header
        run: |
          {
            echo '# TCK result'
            echo '![TCK passed count](https://a11y-shields-badge.kphrx.workers.dev/badge/TCK%20passed-${{ steps.tck.outputs.pass }}-success?style=flat-square) ![TCK passed count](https://a11y-shields-badge.kphrx.workers.dev/badge/TCK%20failed-${{ steps.tck.outputs.fail }}-important?style=flat-square)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate summary
        id: summary
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          WORKSPACE: ${{ github.workspace }}
        with:
          script: |
            const {format} = await import('node:path');
            const {parseOutputFile} = await import(`${process.env.WORKSPACE}/.github/scripts/tck-summary.js`);
            return await parseOutputFile({
              path: format({
                dir: `${process.env.WORKSPACE}/asciidoc-tck`,
                name: 'output',
                ext: 'txt',
              }),
              core,
            });


  result:

    runs-on: ubuntu-latest
    needs: tck
    concurrency:
      group: tck
      cancel-in-progress: true
    permissions:
      checks: write
    env:
      BADGE_GIST_ID: e795d8d23466d049a08e03c23301e996

    steps:
      - name: Result badge
        if: github.event_name != 'pull_request'
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistId: ${{ env.BADGE_GIST_ID }}
          filename: asciidoc2rs-tck-tests.json
          label: TCK tests
          valColorRange: ${{ needs.tck.outputs.passed }}
          maxColorRange: ${{ needs.tck.outputs.tests }}
          minColorRange: 0
          message: ${{ needs.tck.outputs.passed }} / ${{ needs.tck.outputs.tests }}

      - name: Status
        uses: actions/github-script@v9
        env:
          RESULTS: ${{ needs.tck.outputs.results }}
          TESTS: ${{ needs.tck.outputs.tests }}
          PASSED: ${{ needs.tck.outputs.passed }}
          FAILED: ${{ needs.tck.outputs.failed }}
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const summary = () => Object.create(Object.getPrototypeOf(core.summary)).emptyBuffer();
            if (context.eventName === 'pull_request') {
              await github.rest.checks.createCommitStatus({
                owner,
                repo,
                sha: context.payload.pull_request.head.sha,
                state: "success",
                description: `TCK result: ${process.env.PASSED} passed, ${process.env.FAILED} failed`
              });
            } else {
              await github.rest.checks.create({
                owner,
                repo,
                name: `TCK result`,
                head_sha: context.sha,
                status: "completed",
                conclusion: "success",
                output: {
                  title: `${process.env.PASSED} passed, ${process.env.FAILED} failed`,
                  summary: summary().addRaw(`${process.env.PASSED} / ${process.env.TESTS}`)
                    .addTable(results.reduce((buffer, test) => {
                      return [...buffer, [
                        test.status ? 'Pass&nbsp;✅' : 'Fail&nbsp;❌',
                        test.name,
                        test.time,
                        test.status ? ''
                        : test.detail == null ? 'Failed Command'
                        : summary().addRaw(test.detail.message)
                            .addDetails(
                              'Error Info',
                              summary().addCodeBlock(test.detail.diff, 'diff').stringify()
                            ).stringify(),
                      ]];
                    }, [[
                      {data: 'Status', header: true},
                      {data: 'Test Case', header: true},
                      {data: 'Execution Time', header: true},
                      {data: '', header: true},
                    ]])).stringify(),
                },
              });
            }
